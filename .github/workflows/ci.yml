name: SwiftPay CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  # ── CI: Test Automation ────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run repository tests
        run: python tests/test_repositories.py

      - name: Run UserService tests
        run: python tests/services/test_user_service.py

      - name: Run TransactionService tests
        run: python tests/services/test_transaction_service.py

      - name: Run API integration tests
        run: python tests/api/test_api.py

      - name: Run full test suite summary
        run: python tests/run_all_tests.py

  # ── CD: Build & Package Release Artifact ──────────────────────────────────
  release:
    name: Build Release Artifact
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build wheel

      - name: Build Python wheel artifact
        run: |
          python -m build --wheel --outdir dist/ || python setup.py bdist_wheel --dist-dir dist/ 2>/dev/null || \
          (mkdir -p dist && zip -r dist/swiftpay-1.0.0.zip src/ services/ repositories/ api/ --exclude "**/__pycache__/*")
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: swiftpay-release-${{ github.sha }}
          path: dist/
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SwiftPay Release v1.0.${{ github.run_number }}
          body: |
            ## SwiftPay Release

            **Built from:** `${{ github.sha }}`
            **Date:** ${{ env.BUILD_DATE }}

            ### What's included
            - Domain model (User, Wallet, Transaction)
            - Repository layer (In-Memory + Stubs)
            - Service layer (UserService, TransactionService, WalletService)
            - REST API (Users, Transactions, Auth, Health)
            - 41 passing tests

            ### Test Results
            All tests passed before this release was created.
          files: dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
