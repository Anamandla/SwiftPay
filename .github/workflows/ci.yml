name: SwiftPay CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# ── Grant GITHUB_TOKEN the permissions it needs ───────────────────────────────
permissions:
  contents: write   # required to create releases and upload artifacts
  actions: read
  checks: write

jobs:
  # ── CI: Test Automation ────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run repository tests
        run: python tests/test_repositories.py

      - name: Run UserService tests
        run: python tests/services/test_user_service.py

      - name: Run TransactionService tests
        run: python tests/services/test_transaction_service.py

      - name: Run API integration tests
        run: python tests/api/test_api.py

      - name: Run full test suite summary
        run: python tests/run_all_tests.py

  # ── CD: Build & Package Release Artifact ──────────────────────────────────
  release:
    name: Build Release Artifact
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # Explicit permissions on the job level too (belt-and-suspenders)
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build release zip artifact
        run: |
          mkdir -p dist
          zip -r dist/swiftpay-${{ github.run_number }}.zip \
            src/ services/ repositories/ api/ tests/ docs/ \
            requirements.txt setup.py README.md \
            --exclude "**/__pycache__/*" "**/*.pyc"
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
          echo "RELEASE_TAG=v1.0.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Upload artifact to Actions
        uses: actions/upload-artifact@v4
        with:
          name: swiftpay-release-${{ github.run_number }}
          path: dist/
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "SwiftPay v1.0.${{ github.run_number }}"
          body: |
            ## SwiftPay Release v1.0.${{ github.run_number }}

            **Commit:** `${{ github.sha }}`
            **Built:** ${{ env.BUILD_DATE }}

            ### Included
            - Domain model (User, Wallet, Transaction)
            - Repository layer (In-Memory + stubs)
            - Service layer (UserService, TransactionService, WalletService)
            - REST API — 13 endpoints
            - 41 passing tests

            ### How to run
            ```bash
            python3 --version        # needs 3.10+
            python3 tests/run_all_tests.py
            python3 api/app.py       # starts API on port 8000
            ```
          files: dist/*
          draft: false
          prerelease: false
          # Uses GITHUB_TOKEN automatically — no secret needed
          token: ${{ secrets.GITHUB_TOKEN }}